#:schema node_modules/wrangler/config-schema.json
name = "ctool"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = false

# 自定义域名配置（如果已在 Cloudflare 托管该域名，取消注释并修改）
routes = [
  { pattern = "ctool.coral.cc.cd", custom_domain = true }
]

# 静态前端资源托管 (Cloudflare Workers Static Assets)
[assets]
directory = "./packages/ctool-core/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# 观测与性能监控
[observability]
enabled = false
